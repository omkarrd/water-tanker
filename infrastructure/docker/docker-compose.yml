version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: watertanker-postgres
    environment:
      POSTGRES_DB: watertanker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d watertanker"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - watertanker-network

  redis:
    image: redis:7-alpine
    container_name: watertanker-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - watertanker-network

  api:
    build:
      context: ../../..
      dockerfile: infrastructure/docker/Dockerfile.api
    container_name: watertanker-api
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/watertanker
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: your-256-bit-secret-key-here-min-32-chars-for-development-only
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - watertanker-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  postgres_data:
  redis_data:

networks:
  watertanker-network:
    driver: bridge